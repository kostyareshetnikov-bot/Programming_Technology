<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная работа №1</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1>Лабораторная работа №4</h1>
      <p class="subtitle">Дисциплина: Языки программирования &nbsp;|&nbsp; Группа: ИС 26-21 ТИПО &nbsp;|&nbsp; Студент: Решетников Константин</p>
    </div>
  </header>

  <main class="container">
    <section class="work-area">
 
      <h2>Форма регистрации студента</h2>
 
      <form id="registration-form" novalidate>
 
        <div class="form-group">
          <label for="fullname">ФИО <span class="required">*</span></label>
          <input type="text" id="fullname" name="fullname" placeholder="Иванов Иван Иванович">
          <span class="error-message" id="fullname-error"></span>
        </div>
 
        <div class="form-group">
          <label for="email">E-mail <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="example@mail.com">
          <span class="error-message" id="email-error"></span>
        </div>
 
        <div class="form-group">
          <label for="course">Курс <span class="required">*</span></label>
          <select id="course" name="course">
            <option value="" selected disabled>Выберите курс</option>
            <option value="1">1 курс</option>
            <option value="2">2 курс</option>
            <option value="3">3 курс</option>
            <option value="4">4 курс</option>
          </select>
          <span class="error-message" id="course-error"></span>
        </div>
 
        <div class="form-group form-group--checkbox">
          <label class="checkbox-label">
            <input type="checkbox" id="agreement" name="agreement">
            Согласен(на) с правилами <span class="required">*</span>
          </label>
          <span class="error-message" id="agreement-error"></span>
        </div>
 
        <button type="submit" class="btn-submit">Зарегистрироваться</button>
 
        <p class="form-success" id="form-success">Регистрация успешно завершена!</p>
 
      </form>
 
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026. Лабораторная работа выполнена в учебных целях.</p>
    </div>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лабораторная работа №5</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1>Лабораторная работа №5</h1>
      <p class="subtitle">Дисциплина: Языки программирования &nbsp;|&nbsp; Группа: ИС 26-21 ТИПО &nbsp;|&nbsp; Студент: Решетников Константин</p>
    </div>
  </header>

  <main class="container">
    <section class="work-area">

      <h2>Форма регистрации</h2>

      <form id="registration-form" novalidate>

        <div class="form-group">
          <label for="name">Имя <span class="required">*</span></label>
          <div class="input-wrapper">
            <input type="text" id="name" name="name" placeholder="Константин">
            <span class="status-icon" id="name-icon"></span>
          </div>
          <span class="error-message" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">E-mail <span class="required">*</span></label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="example@mail.com">
            <span class="status-icon" id="email-icon"></span>
          </div>
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Пароль <span class="required">*</span></label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Минимум 6 символов, с цифрой">
            <span class="status-icon" id="password-icon"></span>
          </div>
          <span class="error-message" id="password-error"></span>
        </div>

        <button type="submit" class="btn-submit">Зарегистрироваться</button>

        <p class="form-success" id="form-success">Регистрация успешно завершена!</p>

      </form>

    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026. Лабораторная работа выполнена в учебных целях.</p>
    </div>
  </footer>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 6: публикация по ID</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Публикация по ID</h1>
      <p class="subtitle">Введите номер от 1 до 100 и получите запись с JSONPlaceholder</p>
    </header>

    <form id="search-form" class="panel">
      <label for="post-id">ID публикации</label>
      <div class="field-row">
        <input id="post-id" type="number" min="1" value="1" required>
        <button id="load" type="submit">Загрузить</button>
        <button id="retry" class="secondary" type="button" hidden>Повторить</button>
      </div>
    </form>

    <p id="status" role="status"></p>
    <div id="result"></div>
  </main>
</body> 
</html>
